# cleanroom_roles.toml
# Cleanroom Python methodology role definitions
# Canonical package address: //update_python_with_ai

[methodology]
name = "python"
description = "Cleanroom literate specification and verification methodology for Python"

[roles.high]
name = "high"
persona = "High-Level Spec Engineer"
src_pattern = "{unit_dir}/high/{unit_name}.md"
guide = "update_python_with_ai/guides/high_level_spec.md"
template = "update_python_with_ai/templates/hls_template.md"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = true
role_deps = []
star_role_deps = ["high"]
common_spec_roles = []
tools = [
    "update_python_with_ai.support.lib.high_lint",
    "update_python_with_ai.support.lib.build_lint_common",
]
active_component_types = ["implementation", "assembly", "interface", "external"]
verify_template = "uv run python -m update_python_with_ai.support.lib.high_lint {unit_dir}/high/{unit_name}.md"

[roles.scenario]
name = "scenario"
persona = "Scenario Author"
src_pattern = "{unit_dir}/scenarios/{unit_name}.md"
guide = "update_python_with_ai/guides/high_to_scenario.md"
template = "update_python_with_ai/templates/scenario_template.md"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = true
role_deps = []
star_role_deps = ["scenario"]
common_spec_roles = ["high"]
tools = [
    "update_with_ai.support.lib.build_lint_common",
]
active_component_types = ["interface", "implementation"]
verify_template = "# Scenario files verified against high_to_scenario.md"

[roles.planning]
name = "planning"
persona = "Planning Engineer"
src_pattern = "{unit_dir}/planning/{unit_name}.md"
guide = "update_python_with_ai/guides/high_to_planning.md"
template = "update_python_with_ai/templates/planning_template.md"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = true
role_deps = []
star_role_deps = ["planning"]
feedback_role_deps = ["high"]
common_spec_roles = ["high"]
tools = [
    "update_with_ai.support.lib.build_lint_common",
]
active_component_types = ["implementation", "interface"]
verify_template = "# Planning canvas verified against high_to_planning.md"

[roles.low]
name = "low"
persona = "Low-Level Spec Engineer"
src_pattern = "{unit_dir}/low/{unit_name}.pyi"
guide = "update_python_with_ai/guides/planning_to_low.md"
template = "update_python_with_ai/templates/low_template.pyi"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = true
role_deps = []
star_role_deps = ["low"]
feedback_role_deps = ["planning"]
common_spec_roles = ["planning"]
tools = [
    "update_with_ai.support.lib.build_lint_common",
]
active_component_types = ["implementation", "assembly", "interface", "external"]
verify_template = "uv run python -m update_python_with_ai.support.lib.low_lint {unit_dir}/low/{unit_name}.pyi && uv run pyright --project $([ -f pyright_spec.json ] && echo pyright_spec.json || find . -name pyright_spec.json -not -path '*/.*' | head -n 1) {unit_dir}/low/{unit_name}.pyi"

[roles.spec_qa]
name = "spec_qa"
persona = "Specification QA Arbiter"
src_pattern = ""
guide = "update_python_with_ai/guides/spec_qa.md"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = false
role_deps = ["scenario"]
star_role_deps = ["high", "planning", "low"]
feedback_role_deps = ["high", "planning", "low"]
common_spec_roles = ["high", "planning", "scenario"]
tools = [
    "update_python_with_ai.support.lib.high_lint",
    "update_python_with_ai.support.lib.spec_lint",
    "update_python_with_ai.support.lib.low_lint",
    "update_python_with_ai.support.lib.build_lint_common",
]
active_component_types = ["implementation", "assembly", "interface"]
verify_template = "uv run python -m update_python_with_ai.support.lib.high_lint {unit_dir}/high/{unit_name}.md && (! test -f {unit_dir}/planning/{unit_name}.md || uv run python -m update_python_with_ai.support.lib.spec_lint {unit_dir}/planning/{unit_name}.md) && uv run python -m update_python_with_ai.support.lib.low_lint {unit_dir}/low/{unit_name}.pyi && uv run pyright --project $([ -f pyright_spec.json ] && echo pyright_spec.json || find . -name pyright_spec.json -not -path '*/.*' | head -n 1) {unit_dir}/low/{unit_name}.pyi"
verification_success_message = "Specification, planning, and low-level specification verified for {unit_name}."

[roles.lib]
name = "lib"
persona = "Lib Engineer"
src_pattern = "{unit_dir}/lib/{unit_name}.py"
guide = "update_python_with_ai/guides/low_to_lib.md"
template = "update_python_with_ai/templates/lib_template.py"
template_command = "uv run python -m update_python_with_ai.support.lib.lib_lint --scaffold {target_file}"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = true
role_deps = []
star_role_deps = ["low"]
silent_role_deps = ["spec_qa"]
silent_cross_role_deps = ["lib"]
common_spec_roles = ["low"]
tools = [
    "update_python_with_ai.support.lib.lib_lint",
    "update_python_with_ai.support.lib.build_lint_common",
]
active_component_types = ["implementation", "assembly", "interface"]
verify_template = "uv run python -m update_python_with_ai.support.lib.lib_lint {unit_dir}/lib/{unit_name}.py --pyi {unit_dir}/low/{unit_name}.pyi && uv run pyright {unit_dir}/lib/{unit_name}.py"
verification_success_message = "{unit_name}.py passed static checks (syntax & types). IMPORTANT: Static verification does NOT run unit tests or verify runtime logic. If this target has unacted feedback, you must resolve the defect against low/*.pyi contracts and tests before submitting."

[roles.test]
name = "test"
persona = "Test Engineer"
pipeline = "standard"
src_pattern = "{unit_dir}/tests/{unit_name}_test.py"
guide = "update_python_with_ai/guides/low_to_test.md"
template = "update_python_with_ai/templates/test_template.py"
template_command = "uv run python -m update_python_with_ai.support.lib.test_lint --scaffold {target_file} --lib-pkg {unit_dir}/lib"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = true
role_deps = []
star_role_deps = ["low"]
silent_role_deps = ["spec_qa"]
stub_role_deps = ["lib"]
silent_cross_role_deps = ["lib"]
common_spec_roles = ["low"]
tools = [
    "update_python_with_ai.support.lib.test_lint",
    "update_python_with_ai.support.lib.build_lint_common",
]
active_component_types = ["implementation"]
verify_template = "uv run python -m update_python_with_ai.support.lib.test_lint {unit_dir}/tests/{unit_name}_test.py --pyi {unit_dir}/low/{unit_name}.pyi && uv run pyright {unit_dir}/tests/{unit_name}_test.py"

verification_success_message = "{unit_name}_test.py passed static checks (syntax & types). IMPORTANT: Static verification does NOT execute test suites. Call check_file often to verify test structure and imports."

[roles.qa]
name = "qa"
persona = "QA Arbiter"
pipeline = "standard"
src_pattern = ""
guide = "update_python_with_ai/guides/qa.md"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = false
role_deps = []
star_role_deps = ["low"]
feedback_role_deps = ["lib", "test"]
common_spec_roles = ["low"]
tools = []
active_component_types = ["implementation"]
verify_template = "uv run pytest {unit_dir}/tests/{unit_name}_test.py --timeout=10 --timeout-method=thread"
verification_success_message = "Test {unit_name}_test.py passed."

[roles.coverage]
name = "coverage"
persona = "Coverage Arbiter"
pipeline = "standard"
src_pattern = ""
guide = "update_python_with_ai/guides/coverage.md"
prompt_template = "Files are aligned according to the guide. Coverage audits must be formulated strictly against public specification contracts. Never demand testing private helpers or internal methods; uncovered defensive branches belong to the library to prune as dead code or mark as unreachable according to the methodology."
allows_step_mode = false
role_deps = []
silent_role_deps = ["qa"]
star_role_deps = ["low"]
feedback_role_deps = ["lib", "test"]
common_spec_roles = ["low"]
tools = [
    "update_with_ai.support.lib.cleanroom_role_tool",
]
active_component_types = ["implementation"]
verify_template = "uv run pytest {unit_dir}/tests/{unit_name}_test.py --timeout=10 --timeout-method=thread && uv run python -m update_with_ai.support.lib.cleanroom_role_tool coverage --impl {unit_dir}/lib/{unit_name}.py --test {unit_dir}/tests/{unit_name}_test.py --threshold 100.0"
verification_success_message = "All lines of {unit_name}.py are covered by {unit_name}_test.py."

[roles.pretense]
name = "pretense"
persona = "Pretense Engineer"
pipeline = "pretense"
src_pattern = "{unit_dir}/pretense/{unit_name}_pretense.py"
guide = "update_python_with_ai/guides/pretense.md"
template = "update_python_with_ai/templates/pretense_template.py"
template_command = "uv run python -m update_python_with_ai.support.lib.pretense_lint --scaffold {target_file} --pyi {unit_dir}/low/{unit_name}.pyi --impl {unit_dir}/lib/{unit_name}.py"
prompt_template = "Files are aligned according to the guide. In Pretense test suites, define transition postconditions in ctx.ensures(...). In Test<Target>ImplReal, bind real instances into self.sm = TargetStateMachine(singletons={...}) and drive scenarios via self.sm.dispatch_transition(...) without redundant manual assertions, relying on ctx.ensures(...) to verify contracts automatically."
allows_step_mode = true
role_deps = []
star_role_deps = ["low"]
silent_role_deps = ["spec_qa"]
stub_role_deps = ["lib"]
silent_cross_role_deps = ["lib"]
common_spec_roles = ["low"]
tools = [
    "update_python_with_ai.support.lib.pretense_lint",
    "update_python_with_ai.support.lib.build_lint_common",
]
active_component_types = ["implementation"]
verify_template = "uv run python -m update_python_with_ai.support.lib.pretense_lint {unit_dir}/pretense/{unit_name}_pretense.py --pyi {unit_dir}/low/{unit_name}.pyi && uv run pyright {unit_dir}/pretense/{unit_name}_pretense.py"
verification_success_message = "{unit_name}_pretense.py passed static checks (syntax & types). IMPORTANT: Static verification does NOT execute test suites. Call check_file often to verify pretense structure."

[roles.pretense_qa]
name = "pretense_qa"
persona = "Pretense QA Arbiter"
pipeline = "pretense"
src_pattern = ""
guide = "update_python_with_ai/guides/pretense_qa.md"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = false
role_deps = []
star_role_deps = ["low"]
feedback_role_deps = ["lib", "pretense"]
common_spec_roles = ["low"]
tools = []
active_component_types = ["implementation"]
verify_template = "uv run pretense {unit_dir}/pretense/{unit_name}_pretense.py"
verification_success_message = "Pretense test {unit_name}_pretense.py passed."

[roles.pretense_coverage]
name = "pretense_coverage"
persona = "Pretense Coverage Arbiter"
pipeline = "pretense"
src_pattern = ""
guide = "update_python_with_ai/guides/pretense_coverage.md"
prompt_template = "Files are aligned according to the guide. Coverage audits must be formulated strictly against public specification contracts. Never demand testing private helpers or internal methods; uncovered defensive branches belong to the library to prune as dead code or mark as unreachable according to the methodology."
allows_step_mode = false
role_deps = []
silent_role_deps = ["pretense_qa"]
star_role_deps = ["low"]
feedback_role_deps = ["lib", "pretense"]
common_spec_roles = ["low"]
tools = []
active_component_types = ["implementation"]
verify_template = "uv run pretense {unit_dir}/pretense/{unit_name}_pretense.py --no-fuzz --cov --threshold 100.0"
verification_success_message = "All lines of {unit_name}.py are covered by {unit_name}_pretense.py."

[fused_roles.baseline]
name = "baseline"
persona = "Baseline Software Developer"
pipeline = "standard"
roles = ["lib", "test", "qa", "coverage"]
guide = "update_python_with_ai/guides/low_to_lib.md"

[fused_roles.pretense_baseline]
name = "pretense_baseline"
persona = "Pretense Baseline Software Developer"
pipeline = "pretense"
roles = ["lib", "pretense", "pretense_qa", "pretense_coverage"]
guide = "update_python_with_ai/guides/low_to_lib.md"

