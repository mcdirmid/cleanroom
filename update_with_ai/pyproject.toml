[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "update_with_ai"
version = "0.1.0"
description = "Cleanroom update_with_ai package"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "pyright>=1.1.350",
    "pytest>=8.0.0",
    "typing-extensions>=4.8.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "openai>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["parts", "support"]

[tool.pytest.ini_options]
testpaths = [
    "parts",
    "support/tests",
    "tests",
]
norecursedirs = [
    ".git",
    ".venv",
    "bazel-*",
    "node_modules",
]
pythonpath = [
    ".",
    "..",
    "parts",
    "support/lib",
]
python_files = ["*_test.py", "test_*.py"]

[tool.pyright]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/*_pb2.py",
    ".venv",
]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = "none"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
