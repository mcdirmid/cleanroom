[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pretense-py"
version = "0.2.3"
description = "Lightweight stateful property testing and behavioral contract framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sean McDirmid", email = "mcdirmid@outlook.com" }
]
dependencies = [
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
]

[project.scripts]
pretense = "pretense.cli:main"

[tool.hatch.build.targets.wheel]
only-include = [
    "__init__.py",
    "cli.py",
    "collection_utils.py",
    "compiler.py",
    "context.py",
    "fake.py",
    "proto.py",
    "sentinels.py",
    "synthesis.py",
    "transition.py",
    "parts",
    "support",
]

[tool.hatch.build.targets.wheel.sources]
"" = "pretense"
