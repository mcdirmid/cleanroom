# autofab_roles.toml
# Autofab Python methodology role definitions
# Canonical package address: //autofab_py

[methodology]
name = "python"
description = "Cleanroom literate specification and verification methodology for Python"

[roles.high]
name = "high"
persona = "High-Level Spec Engineer"
src_pattern = "{unit_dir}/high/{unit_name}.md"
guide = "autofab_py/guides/high_level_spec.md"
template = "autofab_py/templates/hls_template.md"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = true
role_deps = []
star_role_deps = ["high"]
common_spec_roles = []
tools = [
    "autofab_py.support.lib.high_lint",
    "autofab_py.support.lib.build_lint_common",
]
active_component_types = ["implementation", "assembly", "interface", "external"]
verify_template = "uv run python -m autofab_py.support.lib.high_lint {unit_dir}/high/{unit_name}.md"

[roles.scenario]
name = "scenario"
persona = "Scenario Author"
src_pattern = "{unit_dir}/scenarios/{unit_name}.md"
guide = "autofab_py/guides/high_to_scenario.md"
template = "autofab_py/templates/scenario_template.md"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = true
role_deps = []
star_role_deps = ["scenario"]
common_spec_roles = ["high"]
tools = [
    "autofab_py.support.lib.build_lint_common",
]
active_component_types = ["interface", "implementation"]
verify_template = "# Scenario files verified against high_to_scenario.md"

[roles.planning]
name = "planning"
persona = "Planning Engineer"
src_pattern = "{unit_dir}/planning/{unit_name}.md"
guide = "autofab_py/guides/high_to_planning.md"
template = "autofab_py/templates/planning_template.md"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = true
role_deps = []
star_role_deps = ["planning"]
feedback_role_deps = ["high"]
common_spec_roles = ["high"]
tools = [
    "autofab_py.support.lib.build_lint_common",
]
active_component_types = ["implementation", "interface"]
verify_template = "# Planning canvas verified against high_to_planning.md"

[roles.low]
name = "low"
persona = "Low-Level Spec Engineer"
src_pattern = "{unit_dir}/low/{unit_name}.pyi"
guide = "autofab_py/guides/planning_to_low.md"
template = "autofab_py/templates/low_template.pyi"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = true
role_deps = []
star_role_deps = ["low"]
feedback_role_deps = ["planning"]
common_spec_roles = ["planning"]
tools = [
    "autofab_py.support.lib.build_lint_common",
]
active_component_types = ["implementation", "assembly", "interface", "external"]
verify_template = "uv run python -m autofab_py.support.lib.low_lint {unit_dir}/low/{unit_name}.pyi && uv run pyright --project $([ -f pyright_spec.json ] && echo pyright_spec.json || find . -name pyright_spec.json -not -path '*/.*' | head -n 1) {unit_dir}/low/{unit_name}.pyi"

[roles.spec_qa]
name = "spec_qa"
persona = "Specification QA Arbiter"
src_pattern = ""
guide = "autofab_py/guides/spec_qa.md"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = false
role_deps = ["scenario"]
star_role_deps = ["high", "planning", "low"]
feedback_role_deps = ["high", "planning", "low"]
common_spec_roles = ["high", "planning", "scenario"]
tools = [
    "autofab_py.support.lib.high_lint",
    "autofab_py.support.lib.spec_lint",
    "autofab_py.support.lib.low_lint",
    "autofab_py.support.lib.build_lint_common",
]
active_component_types = ["implementation", "assembly", "interface"]
verify_template = "uv run python -m autofab_py.support.lib.high_lint {unit_dir}/high/{unit_name}.md && (! test -f {unit_dir}/planning/{unit_name}.md || uv run python -m autofab_py.support.lib.spec_lint {unit_dir}/planning/{unit_name}.md) && uv run python -m autofab_py.support.lib.low_lint {unit_dir}/low/{unit_name}.pyi && uv run pyright --project $([ -f pyright_spec.json ] && echo pyright_spec.json || find . -name pyright_spec.json -not -path '*/.*' | head -n 1) {unit_dir}/low/{unit_name}.pyi"
verification_success_message = "Specification, planning, and low-level specification verified for {unit_name}."

[roles.lib]
name = "lib"
persona = "Lib Engineer"
src_pattern = "{unit_dir}/lib/{unit_name}.py"
guide = "autofab_py/guides/low_to_lib.md"
template = "autofab_py/templates/lib_template.py"
template_command = "uv run python -m autofab_py.support.lib.lib_lint --scaffold {target_file}"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = true
role_deps = []
star_role_deps = ["low"]
silent_role_deps = ["spec_qa"]
silent_cross_role_deps = ["lib"]
common_spec_roles = ["low"]
tools = [
    "autofab_py.support.lib.lib_lint",
    "autofab_py.support.lib.build_lint_common",
]
active_component_types = ["implementation", "assembly", "interface"]
verify_template = "uv run python -m autofab_py.support.lib.lib_lint {unit_dir}/lib/{unit_name}.py --pyi {unit_dir}/low/{unit_name}.pyi && uv run pyright {unit_dir}/lib/{unit_name}.py"
verification_success_message = "{unit_name}.py passed static checks (syntax & types). IMPORTANT: Static verification does NOT run unit tests or verify runtime logic. You are not allowed to execute tests or run ad-hoc probes. Submit work with 'bin/submit' so a downstream QA auditor can execute tests on your behalf."

[roles.test]
name = "test"
persona = "Test Engineer"
pipeline = "standard"
src_pattern = "{unit_dir}/tests/{unit_name}_test.py"
guide = "autofab_py/guides/low_to_test.md"
template = "autofab_py/templates/test_template.py"
template_command = "uv run python -m autofab_py.support.lib.test_lint --scaffold {target_file} --lib-pkg {unit_dir}/lib"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = true
role_deps = []
star_role_deps = ["low"]
silent_role_deps = ["spec_qa"]
stub_role_deps = ["lib"]
silent_cross_role_deps = ["lib"]
common_spec_roles = ["low"]
tools = [
    "autofab_py.support.lib.test_lint",
    "autofab_py.support.lib.build_lint_common",
]
active_component_types = ["implementation"]
verify_template = "uv run python -m autofab_py.support.lib.test_lint {unit_dir}/tests/{unit_name}_test.py --pyi {unit_dir}/low/{unit_name}.pyi && uv run pyright {unit_dir}/tests/{unit_name}_test.py"

verification_success_message = "{unit_name}_test.py passed static checks (syntax & types). IMPORTANT: You are not allowed to execute the test suite or run ad-hoc probes. Submit work with 'bin/submit' so a downstream QA auditor can execute the test suite on your behalf."

[roles.qa]
name = "qa"
persona = "QA Arbiter"
pipeline = "standard"
src_pattern = ""
guide = "autofab_py/guides/qa.md"
prompt_template = "Audit implementation against specifications and verify test suites. Target Disparity: Your check_files target is lib/<name>.py, but verification executes tests/<name>_test.py. NEVER default to blaming lib/<name>.py for test failures. If tests assert unmandated behavior, pass invalid types, fail to register mock collaborators (LifecycleResolutionError), or assert uncontracted preconditions, blame tests/<name>_test.py, NOT lib. Files are aligned according to the guide."
allows_step_mode = false
role_deps = []
star_role_deps = ["low"]
feedback_role_deps = ["lib", "test"]
common_spec_roles = ["low"]
tools = []
active_component_types = ["implementation"]
verify_template = "uv run pytest {unit_dir}/tests/{unit_name}_test.py --timeout=10 --timeout-method=thread"
verification_success_message = "Test {unit_name}_test.py passed."

[roles.coverage]
name = "coverage"
persona = "Coverage Arbiter"
pipeline = "standard"
src_pattern = ""
guide = "autofab_py/guides/coverage.md"
prompt_template = "Files are aligned according to the guide. Coverage audits must be formulated strictly against public specification contracts. Never demand testing private helpers or internal methods; uncovered defensive branches belong to the library to wrap with with unreachable: or mark with unreachable(). If an uncovered line persists after tests were updated or across multiple rounds, examine the library implementation closely to determine if the line is structurally or logically unreachable; if so, blame the library to wrap with with unreachable: or mark with unreachable()."
allows_step_mode = false
role_deps = []
silent_role_deps = ["qa"]
star_role_deps = ["low"]
feedback_role_deps = ["lib", "test"]
common_spec_roles = ["low"]
tools = [
    "autofab.support.lib.autofab_role_tool",
]
active_component_types = ["implementation"]
verify_template = "uv run python -m autofab.support.lib.autofab_role_tool coverage --impl {unit_dir}/lib/{unit_name}.py --test {unit_dir}/tests/{unit_name}_test.py --threshold 100.0"
verification_success_message = "All lines of {unit_name}.py are covered by {unit_name}_test.py."

[roles.pretense]
name = "pretense"
persona = "Pretense Engineer"
pipeline = "pretense"
src_pattern = "{unit_dir}/pretense/{unit_name}_pretense.py"
guide = "autofab_py/guides/pretense.md"
template = "autofab_py/templates/pretense_template.py"
template_command = "uv run python -m autofab_py.support.lib.pretense_lint --scaffold {target_file} --pyi {unit_dir}/low/{unit_name}.pyi --impl {unit_dir}/lib/{unit_name}.py --lib-pkg {unit_dir}/lib"
prompt_template = "Files are aligned according to the guide. Interface pretense modules define <Iface>State, <Iface>StateMachine (using strict 1:1 transitions calling inner transitions self.inner_<method>(...) to compute fake return values strictly from self.state without invoking sut(...) or target methods, and single-argument assert), synthesize_fake, make_<iface>_fake, Fake<Iface>FuzzTest, and optional Test<Iface>Fake fixed tests only for transitions or branches not covered by Fake<Iface>FuzzTest. In interface state machines, inner_<method> computes fake return values strictly from self.state (or returns None), must never raise exceptions, must never contain assert statements (PRE_LINT_NO_ASSERT_IN_INNER), must never mutate self.state (PRE_LINT_NO_STATE_MUTATION_IN_INNER), and must never invoke target methods or sut(...) (causes infinite mutual recursion with synthesized fakes); sut(...) is allowed strictly within assert statements to check observable fake properties. Implementation pretense modules import the interface state machine and collaborator fakes, define implementation pseudo-state machines (inheriting interface state machines without defining new state dataclasses and containing zero require_arg statements) overriding inner transitions to invoke target methods on target = sut(TargetClass) without calling super() (PRE_LINT_NO_SUPER_IN_IMPL_INNER), Test<Impl>Real (driving scenarios via checked adapters), and compile_hypothesis_test_case. Domain.any() is strictly banned (PRE_LINT_NO_DOMAIN_ANY); all parameter domains in require_arg must be explicitly typed matching low/*.pyi. Dynamic argument-to-state gating uses Domain.not_in(...) or Domain.in_set(...). preferred=[...] supplies prioritized sampling seeds for fakes and fuzzing without restricting caller contracts on checked adapters. Multi-transition splitting for the same method is strictly prohibited (PN_STRICT_1_TO_1); branching outcomes branch naturally inside the single transition body. Preconditions in require(...) must only evaluate self.state without referencing input arguments (PN009). Implementation pseudo-state machines must never declare @transition or override outer transitions (PN_IMPL_NO_OUTER_TRANSITION); they only override inner transitions ('inner_<name>'). Implementation pseudo-state machine transitions must never mutate self.state (PN_IMPL_NO_STATE_MUTATION; state mutations are owned exclusively by inherited interface transitions). All assertions use single-argument assert test (PRE_LINT_ASSERT_SINGLE_ARG)."
allows_step_mode = true
role_deps = []
star_role_deps = ["low", "pretense"]
silent_role_deps = ["spec_qa"]
stub_role_deps = ["lib"]
silent_cross_role_deps = ["lib"]
common_spec_roles = ["low"]
tools = [
    "autofab_py.support.lib.pretense_lint",
    "autofab_py.support.lib.build_lint_common",
]
active_component_types = ["interface", "implementation"]
verify_template = "uv run python -m autofab_py.support.lib.pretense_lint {unit_dir}/pretense/{unit_name}_pretense.py --pyi {unit_dir}/low/{unit_name}.pyi --lib-pkg {unit_dir}/lib && uv run pyright {unit_dir}/pretense/{unit_name}_pretense.py && (case '{unit_name}' in *_impl) true ;; *) uv run pretense {unit_dir}/pretense/{unit_name}_pretense.py --cov ;; esac)"
verification_success_message = "{unit_name}_pretense.py passed verification. For interface components, fake state transitions and property fuzzing have been verified. For implementation components, static checks passed; submit work with 'bin/submit' so a downstream QA auditor can execute the real test suite."

[roles.pretense_qa]
name = "pretense_qa"
persona = "Pretense QA Arbiter"
pipeline = "pretense"
src_pattern = ""
guide = "autofab_py/guides/pretense_qa.md"
prompt_template = "Audit the implementation pretense against the specification and verify test scenarios and state machine coverage. Target Disparity & Comparative Arbitration: Your check_files target is lib/<name>.py, but verification executes pretense state machines. Neither lib nor pretense is presumed guilty. Compare both against the authoritative source of truth (low/<name>.pyi and specification grounding). If the concrete SUT behavior violates what is contracted in low/*.pyi, blame lib/<name>.py. If the SUT conforms to low/*.pyi but the interface state machine or test scenario asserts an uncontracted expectation, overspecifies an oracle, contradicts low/*.pyi, or mandates an invalid sequence, blame pretense (pretense/<unit>_pretense.py for model flaws or pretense/<unit>_impl_pretense.py for test overspecification). Frame test failures strictly as contract discrepancies against low-level specifications. Transitions must follow strict 1:1 mapping with public methods (PN_STRICT_1_TO_1); branching outcomes and exception checks branch naturally via if/else inside the transition body. If a contracted requirement cannot be verified due to a missing @test_only query accessor, attribute blame to low/<name>.pyi."
allows_step_mode = false
role_deps = []
star_role_deps = ["low"]
star_feedback_role_deps = ["pretense"]
feedback_role_deps = ["lib"]
common_spec_roles = ["low"]
tools = []
active_component_types = ["implementation"]
verify_template = "uv run pretense {unit_dir}/pretense/{unit_name}_pretense.py"
verification_success_message = "Pretense test {unit_name}_pretense.py passed."

[roles.pretense_coverage]
name = "pretense_coverage"
persona = "Pretense Coverage Arbiter"
pipeline = "pretense"
src_pattern = ""
guide = "autofab_py/guides/pretense_coverage.md"
prompt_template = "Files are aligned according to the guide. Coverage audits must be formulated strictly against public specification contracts. Multi-Round Reachability Protocol: When coverage deficits exist, perform a shallow simulation of the uncovered branch. If the branch represents a plausible domain scenario or error path, blame the companion pretense test file (pretense/{unit_name}_impl_pretense.py) first to author an exercising scenario. If the pretense author cannot reach the line after one round, blame the library (lib/{unit_name}.py) to prune dead code, wrap with with unreachable:, or mark with unreachable(). Property fuzzing provides the dynamic runtime backstop. Never demand testing private helpers or internal methods. Attributing implementation coverage deficits to upstream interface state machines is strictly prohibited."
allows_step_mode = false
role_deps = []
silent_role_deps = ["pretense_qa"]
star_role_deps = ["low", "pretense"]
feedback_role_deps = ["lib", "pretense"]
common_spec_roles = ["low"]
tools = []
active_component_types = ["implementation"]
verify_template = "uv run pretense {unit_dir}/pretense/{unit_name}_pretense.py --cov --threshold 100.0"
verification_success_message = "All lines of {unit_name}.py are covered by {unit_name}_pretense.py."

[fused_roles.baseline]
name = "baseline"
persona = "Baseline Software Developer"
pipeline = "standard"
roles = ["lib", "test", "qa", "coverage"]
guide = "autofab_py/guides/low_to_lib.md"

[fused_roles.pretense_baseline]
name = "pretense_baseline"
persona = "Pretense Baseline Software Developer"
pipeline = "pretense"
roles = ["lib", "pretense", "pretense_qa", "pretense_coverage"]
guide = "autofab_py/guides/low_to_lib.md"

[fused_roles.combined_baseline]
name = "combined_baseline"
persona = "Combined Baseline Software Developer"
pipeline = "combined"
roles = ["lib", "test", "qa", "pretense", "pretense_qa", "coverage", "pretense_coverage"]
guide = "autofab_py/guides/low_to_lib.md"


