# model_configs.toml
# Native model configuration definitions and rate card catalog for Autofab.
#
# Autofab resolves model configurations from:
#   1. Explicit override via AUTOFAB_MODEL_CONFIG_FILE or --model flag
#   2. Local workspace repository: ./model_configs.toml
#   3. User global configuration: ~/.config/autofab/model_configs.toml (default)
#   4. Canonical starter template: autofab_py/templates/model_configs.toml
#
# ==============================================================================
# Global Configuration
# ==============================================================================
# default: Default model profile used when none is specified.
# The runtime harness ("dsh", "antigravity") is derived directly from the model profile.
default = "deepseek-flash"

# dsh_web: Execution mode for DSH models (true = DSH Web bridge).
dsh_web = true

# max_unproductive_rounds: Global circuit breaker limit for consecutive rounds
# that fail to produce change or progress before aborting.
max_unproductive_rounds = 3

# run_timeout_seconds: Global benchmark flight execution timeout in seconds (default: 3600s = 1 hour).
# Can be overridden per model profile below or via CLI flag --timeout.
run_timeout_seconds = 3600.0

# ==============================================================================
# Model Table Schema: [models.<profile-name>]
# ==============================================================================
# Each table under [models.<name>] configures an individual model profile.
#
# Field Definitions:
#   model               (str, required)   : Model identifier string passed to harness/agent.
#   provider            (str, required)   : Provider protocol adapter ("mlx", "omlx", "deepseek", "google", "anthropic", "openai").
#   harness             (str, required)   : Runtime harness for this model ("dsh", "antigravity").
#   tier                (int, optional)   : Capability tier for benchmark stratification:
#                                             1 = Local Engine ($0.00 / free offline)
#                                             2 = Budget API (sub-penny with context caching)
#                                             3 = Mid-Tier Control (balanced commercial models)
#                                             4 = Frontier Ceiling (state-of-the-art capability anchor)
#   tier_label          (str, optional)   : Human-readable label for the capability tier.
#   rate_uncached_in    (float, optional) : Inbound cost in USD per 1,000,000 uncached prompt tokens.
#   rate_cached_in      (float, optional) : Inbound cost in USD per 1,000,000 context-cache hit prompt tokens.
#   rate_out            (float, optional) : Outbound cost in USD per 1,000,000 completion tokens.
#   timeout_seconds     (float, optional) : Per-request timeout in seconds.
#   subagent_batch_size (int, optional)   : Maximum concurrent role subagent dispatches.
#   concurrent_subagents (int, optional)  : Maximum concurrent running subagents (only 1 supported; unset = unlimited). Disallowed for antigravity models.
# ==============================================================================

# ==============================================================================
# Model Profiles
# ==============================================================================

