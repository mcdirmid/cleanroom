[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autofab-py"
version = "0.2.4"
description = "Python methodology and verification tools for the Autofab framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sean McDirmid", email = "mcdirmid@outlook.com" }
]
dependencies = [
    "pyright>=1.1.350",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["__init__.py", "support", "guides", "autofab_roles.toml", "pyright_spec.json", "templates"]

[tool.hatch.build.targets.wheel.sources]
"" = "autofab_py"
