# autofab_roles.toml
# Autofab Python methodology role definitions
# Canonical package address: //autofab_python

[methodology]
name = "python"
description = "Cleanroom literate specification and verification methodology for Python"

[roles.high]
name = "high"
persona = "High-Level Spec Engineer"
src_pattern = "{unit_dir}/high/{unit_name}.md"
guide = "autofab_python/guides/high_level_spec.md"
template = "autofab_python/templates/hls_template.md"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = true
role_deps = []
star_role_deps = ["high"]
common_spec_roles = []
tools = [
    "autofab_python.support.lib.high_lint",
    "autofab_python.support.lib.build_lint_common",
]
active_component_types = ["implementation", "assembly", "interface", "external"]
verify_template = "uv run python -m autofab_python.support.lib.high_lint {unit_dir}/high/{unit_name}.md"

[roles.scenario]
name = "scenario"
persona = "Scenario Author"
src_pattern = "{unit_dir}/scenarios/{unit_name}.md"
guide = "autofab_python/guides/high_to_scenario.md"
template = "autofab_python/templates/scenario_template.md"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = true
role_deps = []
star_role_deps = ["scenario"]
common_spec_roles = ["high"]
tools = [
    "autofab.support.lib.build_lint_common",
]
active_component_types = ["interface", "implementation"]
verify_template = "# Scenario files verified against high_to_scenario.md"

[roles.planning]
name = "planning"
persona = "Planning Engineer"
src_pattern = "{unit_dir}/planning/{unit_name}.md"
guide = "autofab_python/guides/high_to_planning.md"
template = "autofab_python/templates/planning_template.md"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = true
role_deps = []
star_role_deps = ["planning"]
feedback_role_deps = ["high"]
common_spec_roles = ["high"]
tools = [
    "autofab.support.lib.build_lint_common",
]
active_component_types = ["implementation", "interface"]
verify_template = "# Planning canvas verified against high_to_planning.md"

[roles.low]
name = "low"
persona = "Low-Level Spec Engineer"
src_pattern = "{unit_dir}/low/{unit_name}.pyi"
guide = "autofab_python/guides/planning_to_low.md"
template = "autofab_python/templates/low_template.pyi"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = true
role_deps = []
star_role_deps = ["low"]
feedback_role_deps = ["planning"]
common_spec_roles = ["planning"]
tools = [
    "autofab.support.lib.build_lint_common",
]
active_component_types = ["implementation", "assembly", "interface", "external"]
verify_template = "uv run python -m autofab_python.support.lib.low_lint {unit_dir}/low/{unit_name}.pyi && uv run pyright --project $([ -f pyright_spec.json ] && echo pyright_spec.json || find . -name pyright_spec.json -not -path '*/.*' | head -n 1) {unit_dir}/low/{unit_name}.pyi"

[roles.spec_qa]
name = "spec_qa"
persona = "Specification QA Arbiter"
src_pattern = ""
guide = "autofab_python/guides/spec_qa.md"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = false
role_deps = ["scenario"]
star_role_deps = ["high", "planning", "low"]
feedback_role_deps = ["high", "planning", "low"]
common_spec_roles = ["high", "planning", "scenario"]
tools = [
    "autofab_python.support.lib.high_lint",
    "autofab_python.support.lib.spec_lint",
    "autofab_python.support.lib.low_lint",
    "autofab_python.support.lib.build_lint_common",
]
active_component_types = ["implementation", "assembly", "interface"]
verify_template = "uv run python -m autofab_python.support.lib.high_lint {unit_dir}/high/{unit_name}.md && (! test -f {unit_dir}/planning/{unit_name}.md || uv run python -m autofab_python.support.lib.spec_lint {unit_dir}/planning/{unit_name}.md) && uv run python -m autofab_python.support.lib.low_lint {unit_dir}/low/{unit_name}.pyi && uv run pyright --project $([ -f pyright_spec.json ] && echo pyright_spec.json || find . -name pyright_spec.json -not -path '*/.*' | head -n 1) {unit_dir}/low/{unit_name}.pyi"
verification_success_message = "Specification, planning, and low-level specification verified for {unit_name}."

[roles.lib]
name = "lib"
persona = "Lib Engineer"
src_pattern = "{unit_dir}/lib/{unit_name}.py"
guide = "autofab_python/guides/low_to_lib.md"
template = "autofab_python/templates/lib_template.py"
template_command = "uv run python -m autofab_python.support.lib.lib_lint --scaffold {target_file}"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = true
role_deps = []
star_role_deps = ["low"]
silent_role_deps = ["spec_qa"]
silent_cross_role_deps = ["lib"]
common_spec_roles = ["low"]
tools = [
    "autofab_python.support.lib.lib_lint",
    "autofab_python.support.lib.build_lint_common",
]
active_component_types = ["implementation", "assembly", "interface"]
verify_template = "uv run python -m autofab_python.support.lib.lib_lint {unit_dir}/lib/{unit_name}.py --pyi {unit_dir}/low/{unit_name}.pyi && uv run pyright {unit_dir}/lib/{unit_name}.py"
verification_success_message = "{unit_name}.py passed static checks (syntax & types). IMPORTANT: Static verification does NOT run unit tests or verify runtime logic. If this target has unacted feedback, you must resolve the defect against low/*.pyi contracts and tests before submitting."

[roles.test]
name = "test"
persona = "Test Engineer"
pipeline = "standard"
src_pattern = "{unit_dir}/tests/{unit_name}_test.py"
guide = "autofab_python/guides/low_to_test.md"
template = "autofab_python/templates/test_template.py"
template_command = "uv run python -m autofab_python.support.lib.test_lint --scaffold {target_file} --lib-pkg {unit_dir}/lib"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = true
role_deps = []
star_role_deps = ["low"]
silent_role_deps = ["spec_qa"]
stub_role_deps = ["lib"]
silent_cross_role_deps = ["lib"]
common_spec_roles = ["low"]
tools = [
    "autofab_python.support.lib.test_lint",
    "autofab_python.support.lib.build_lint_common",
]
active_component_types = ["implementation"]
verify_template = "uv run python -m autofab_python.support.lib.test_lint {unit_dir}/tests/{unit_name}_test.py --pyi {unit_dir}/low/{unit_name}.pyi && uv run pyright {unit_dir}/tests/{unit_name}_test.py"

verification_success_message = "{unit_name}_test.py passed static checks (syntax & types). IMPORTANT: Static verification does NOT execute test suites. Call check_file often to verify test structure and imports."

[roles.qa]
name = "qa"
persona = "QA Arbiter"
pipeline = "standard"
src_pattern = ""
guide = "autofab_python/guides/qa.md"
prompt_template = "Files are aligned according to the guide."
allows_step_mode = false
role_deps = []
star_role_deps = ["low"]
feedback_role_deps = ["lib", "test"]
common_spec_roles = ["low"]
tools = []
active_component_types = ["implementation"]
verify_template = "uv run pytest {unit_dir}/tests/{unit_name}_test.py --timeout=10 --timeout-method=thread"
verification_success_message = "Test {unit_name}_test.py passed."

[roles.coverage]
name = "coverage"
persona = "Coverage Arbiter"
pipeline = "standard"
src_pattern = ""
guide = "autofab_python/guides/coverage.md"
prompt_template = "Files are aligned according to the guide. Coverage audits must be formulated strictly against public specification contracts. Never demand testing private helpers or internal methods; uncovered defensive branches belong to the library to prune as dead code or mark as unreachable according to the methodology."
allows_step_mode = false
role_deps = []
silent_role_deps = ["qa"]
star_role_deps = ["low"]
feedback_role_deps = ["lib", "test"]
common_spec_roles = ["low"]
tools = [
    "autofab.support.lib.autofab_role_tool",
]
active_component_types = ["implementation"]
verify_template = "uv run pytest {unit_dir}/tests/{unit_name}_test.py --timeout=10 --timeout-method=thread && uv run python -m autofab.support.lib.autofab_role_tool coverage --impl {unit_dir}/lib/{unit_name}.py --test {unit_dir}/tests/{unit_name}_test.py --threshold 100.0"
verification_success_message = "All lines of {unit_name}.py are covered by {unit_name}_test.py."

[roles.pretense]
name = "pretense"
persona = "Pretense Engineer"
pipeline = "pretense"
src_pattern = "{unit_dir}/pretense/{unit_name}_pretense.py"
guide = "autofab_python/guides/pretense.md"
template = "autofab_python/templates/pretense_template.py"
template_command = "uv run python -m autofab_python.support.lib.pretense_lint --scaffold {target_file} --pyi {unit_dir}/low/{unit_name}.pyi --impl {unit_dir}/lib/{unit_name}.py --lib-pkg {unit_dir}/lib"
prompt_template = "Files are aligned according to the guide. Interface pretense modules define <Iface>State, <Iface>StateMachine (using strict 1:1 transitions with make_return_value AST pivot and single-argument assert), synthesize_fake, make_<iface>_fake, and Fake<Iface>FuzzTest without fixed test classes. Implementation pretense modules import the interface state machine and collaborator fakes, define implementation pseudo-state machines (inheriting interface state machines without defining new state dataclasses and containing zero require_arg statements) overriding transitions with ret = call_target(target.method(*args)) AST pivot (where target: TargetClass = sut(TargetClass) preserves static return type R), Test<Impl>Real (driving scenarios via checked adapters), and compile_hypothesis_test_case. Multi-transition splitting for the same method is strictly prohibited (PN_STRICT_1_TO_1); branching outcomes branch naturally inside the single transition body. Preconditions in require(...) must only evaluate self.state without referencing input arguments (PN009). Implementation pseudo-state machine transitions must never mutate self.state (PN_IMPL_NO_STATE_MUTATION; state mutations are owned exclusively by inherited interface transitions). All assertions use single-argument assert test (PRE_LINT_ASSERT_SINGLE_ARG). Zero-argument call_target() is strictly prohibited."
allows_step_mode = true
role_deps = []
star_role_deps = ["low", "pretense"]
silent_role_deps = ["spec_qa"]
stub_role_deps = ["lib"]
silent_cross_role_deps = ["lib"]
common_spec_roles = ["low"]
tools = [
    "autofab_python.support.lib.pretense_lint",
    "autofab_python.support.lib.build_lint_common",
]
active_component_types = ["interface", "implementation"]
verify_template = "uv run python -m autofab_python.support.lib.pretense_lint {unit_dir}/pretense/{unit_name}_pretense.py --pyi {unit_dir}/low/{unit_name}.pyi --lib-pkg {unit_dir}/lib && uv run pyright {unit_dir}/pretense/{unit_name}_pretense.py"
verification_success_message = "{unit_name}_pretense.py passed static checks (syntax & types). IMPORTANT: Static verification does NOT execute test suites. Call check_file often to verify pretense structure."

[roles.pretense_qa]
name = "pretense_qa"
persona = "Pretense QA Arbiter"
pipeline = "pretense"
src_pattern = ""
guide = "autofab_python/guides/pretense_qa.md"
prompt_template = "Audit the implementation pretense against the specification and verify test scenarios and state machine coverage. Frame test failures strictly as contract discrepancies against low-level specifications. Transitions must follow strict 1:1 mapping with public methods (PN_STRICT_1_TO_1); branching outcomes and exception checks branch naturally via if/else inside the transition body. If a contracted requirement cannot be verified due to a missing @test_only query accessor, attribute blame to low/<name>.pyi."
allows_step_mode = false
role_deps = []
star_role_deps = ["low", "pretense"]
feedback_role_deps = ["lib", "pretense"]
common_spec_roles = ["low"]
tools = []
active_component_types = ["implementation"]
verify_template = "uv run pretense {unit_dir}/pretense/{unit_name}_pretense.py"
verification_success_message = "Pretense test {unit_name}_pretense.py passed."

[roles.pretense_coverage]
name = "pretense_coverage"
persona = "Pretense Coverage Arbiter"
pipeline = "pretense"
src_pattern = ""
guide = "autofab_python/guides/pretense_coverage.md"
prompt_template = "Files are aligned according to the guide. Coverage audits must be formulated strictly against public specification contracts. When coverage deficits are due to missing test scenarios, blame the companion pretense test file for the implementation under test (e.g. pretense/{unit_name}_pretense.py), never an upstream interface state machine. Never demand testing private helpers or internal methods; uncovered defensive branches belong to the library to prune as dead code, mark with from pretense import unreachable; unreachable(), or annotate with # pragma: no cover (assumption: <reason>)."
allows_step_mode = false
role_deps = []
silent_role_deps = ["pretense_qa"]
star_role_deps = ["low", "pretense"]
feedback_role_deps = ["lib", "pretense"]
common_spec_roles = ["low"]
tools = []
active_component_types = ["implementation"]
verify_template = "uv run pretense {unit_dir}/pretense/{unit_name}_pretense.py --no-fuzz --cov --threshold 100.0"
verification_success_message = "All lines of {unit_name}.py are covered by {unit_name}_pretense.py."

[fused_roles.baseline]
name = "baseline"
persona = "Baseline Software Developer"
pipeline = "standard"
roles = ["lib", "test", "qa", "coverage"]
guide = "autofab_python/guides/low_to_lib.md"

[fused_roles.pretense_baseline]
name = "pretense_baseline"
persona = "Pretense Baseline Software Developer"
pipeline = "pretense"
roles = ["lib", "pretense", "pretense_qa", "pretense_coverage"]
guide = "autofab_python/guides/low_to_lib.md"


