# model_configs.toml
# Native model configuration definitions and rate card catalog for Cleanroom.
#
# Cleanroom resolves model configurations from:
#   1. Explicit override via CLEANROOM_MODEL_CONFIG_FILE or --model-config flag
#   2. Local workspace repository: ./model_configs.toml
#   3. User global configuration: ~/.config/cleanroom/model_configs.toml (default)
#   4. Canonical starter template: update_python_with_ai/templates/model_configs.toml
#
# ==============================================================================
# Global Configuration
# ==============================================================================
# default: Default model profile used when none is specified.
default = "qwen-moe"

# loop_default: Default model profile for the in-process autonomous loop harness.
loop_default = "qwen-moe"

# antigravity_default: Default model profile for the Google Antigravity harness.
antigravity_default = "gemini-argon"

# dsh_default: Default model profile for the DeepSeek Harness (DSH).
dsh_default = "deepseek-flash"

# max_unproductive_rounds: Global circuit breaker limit for consecutive rounds
# that fail to produce change or progress before aborting.
max_unproductive_rounds = 5

# ==============================================================================
# Model Table Schema: [models.<profile-name>]
# ==============================================================================
# Each table under [models.<name>] configures an individual model profile.
#
# Field Definitions:
#   model                   (str, required)   : Model identifier string passed to the provider API.
#   provider                (str, required)   : Provider protocol adapter ("mlx", "omlx", "deepseek", "google", "openai", "anthropic").
#   tier                    (int, optional)   : Capability tier for benchmark stratification:
#                                                 1 = Local Engine ($0.00 / free offline)
#                                                 2 = Budget API (sub-penny with context caching)
#                                                 3 = Mid-Tier Control (balanced commercial models)
#                                                 4 = Frontier Ceiling (state-of-the-art capability anchor)
#   tier_label              (str, optional)   : Human-readable label for the capability tier.
#   rate_uncached_in        (float, optional) : Inbound cost in USD per 1,000,000 uncached prompt tokens.
#   rate_cached_in          (float, optional) : Inbound cost in USD per 1,000,000 context-cache hit prompt tokens.
#   rate_out                (float, optional) : Outbound cost in USD per 1,000,000 completion tokens (including reasoning).
#   base_url                (str, optional)   : HTTP endpoint base URL for API requests.
#   api_key_env             (str, optional)   : Name of the environment variable containing the API authentication key.
#   default_harness         (str, optional)   : Recommended runtime harness for this model ("loop", "dsh", "antigravity").
#   max_iterations          (int, optional)   : Maximum tool execution iterations per round. Default: 100.
#   temperature             (float, optional) : Sampling temperature for text generation. Default: 0.7.
#   timeout_seconds         (float, optional) : Per-request socket or process timeout in seconds.
#   max_tokens              (int, optional)   : Maximum completion tokens generated per request.
#   subagent_batch_size     (int, optional)   : Maximum concurrent role subagent dispatches.
#   conversation_max_tokens (int, optional)   : Context window compaction threshold in tokens.
#   max_feedback_chars      (int, optional)   : Maximum characters preserved in unacted feedback buffers.
#   max_unproductive_rounds (int, optional)   : Profile-specific circuit breaker limit for consecutive unproductive rounds.
# ==============================================================================

# ==============================================================================
# Model Profiles
# ==============================================================================

