[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cleanroom"
version = "0.2.0"
description = "Literate, specification-driven software engineering framework for autonomous AI pair-programming"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Cleanroom Authors" }
]
dependencies = [
    "pydantic>=2.5.0",
    "pyright>=1.1.350",
    "pytest>=8.0.0",
    "typing-extensions>=4.8.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "openai>=1.0.0",
    "pytest-timeout>=2.3.0",
]

[project.scripts]
cleanroom = "update_with_ai.support.lib.cleanroom_role_tool:main"
cleanroom-loop = "update_with_ai.support.lib.cleanroom_uv_runner:main"
cleanroom_loop = "update_with_ai.support.lib.cleanroom_uv_runner:main"
clean = "update_with_ai.support.lib.cleanroom_role_tool:main_clean"
orchestrate = "update_with_ai.support.lib.cleanroom_role_tool:main_orchestrate"
benchmark = "update_with_ai.support.lib.cleanroom_role_tool:main_benchmark"
pretense = "pretense.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["update_with_ai", "update_python_with_ai", "benchmarks", "pretense"]

[tool.pytest.ini_options]
testpaths = [
    "update_with_ai/parts",
    "update_python_with_ai/parts",
    "update_with_ai/support/tests",
    "update_python_with_ai/support/tests",
]
norecursedirs = [
    ".git",
    ".venv",
    "bazel-*",
    "staging",
    "node_modules",
]
pythonpath = [
    ".",
    "update_with_ai",
    "update_python_with_ai",
    "benchmarks",
]
python_files = ["*_test.py"]
timeout = 45
timeout_method = "signal"
addopts = []

[tool.pyright]
extraPaths = [
    "update_python_with_ai",
]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/*_pb2.py",
    ".venv",
    "**/low",
    "staging",
]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
