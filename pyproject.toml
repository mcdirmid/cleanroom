[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autofab"
version = "0.2.4"
description = "Literate, specification-driven software engineering framework for autonomous AI pair-programming"
readme = "autofab/README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sean McDirmid", email = "mcdirmid@outlook.com" }
]
dependencies = [
    "pydantic>=2.5.0",
    "pyright>=1.1.350",
    "pytest>=8.0.0",
    "typing-extensions>=4.8.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "openai>=1.0.0",
    "pytest-timeout>=2.3.0",
    "hypothesis>=6.100.0",
    "pytest-cov>=5.0.0",
    "coverage>=7.0.0",
    "pytest-xdist>=3.8.0",
    "pytest-testmon>=2.3.0",
]

[project.scripts]
autofab = "autofab.support.lib.autofab_role_tool:main"
pretense = "pretense.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
    "autofab",
    "autofab_py",
    "benchmarks",
    "pretense",
]

[tool.pytest.ini_options]
testpaths = [
    "autofab/parts",
    "pretense/parts",
    "autofab/support/tests",
    "autofab_py/support/tests",
    "pretense/support/tests",
]
norecursedirs = [
    ".git",
    ".venv",
    ".hypothesis",
    "bazel-*",
    "staging",
    "node_modules",
]
pythonpath = [
    ".",
    "autofab",
    "autofab_py",
    "autofab_py/support/lib",
    "autofab/support/lib",
    "benchmarks",
    "pretense",
]
python_files = ["*_test.py"]
timeout = 45
timeout_method = "signal"
addopts = ["--import-mode=importlib"]

[tool.pyright]
extraPaths = [
    ".",
    "autofab",
    "autofab/support/lib",
    "autofab_py",
    "autofab_py/support/lib",
    "pretense",
]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/*_pb2.py",
    ".venv",
    "**/low",
    "staging",
]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.coverage.report]
exclude_also = [
    'def unreachable\(',
    'unreachable\(',
    'assert_never\(',
    'raise AssertionError\(',
    'assert False',
    'raise [A-Za-z0-9_]*Error\(',
    'raise [A-Za-z0-9_]*Error$',
]
